name: Mobile

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'src/app/api/**'
      - 'src/lib/voice/**'
      - 'src/lib/exam-*.ts'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'src/app/api/**'
      - 'src/lib/voice/**'
      - 'src/lib/exam-*.ts'

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
